<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mail Screen - Rose Animation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0f172a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Mail Container Card */
    .mail-card {
      background: #ffffff;
      width: 90%;
      max-width: 440px;
      padding: 36px 28px;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .envelope-icon {
      font-size: 72px;
      margin-bottom: 12px;
      cursor: pointer;
      display: inline-block;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .envelope-icon:hover {
      transform: scale(1.15) rotate(-3deg);
    }

    .mail-title {
      color: #1e293b;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .mail-desc {
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
    }

    .btn-open {
      margin-top: 24px;
      background: linear-gradient(135deg, #e11d48, #f43f5e);
      color: #ffffff;
      border: none;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(225, 29, 72, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-open:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 24px rgba(225, 29, 72, 0.4);
    }

    .btn-open:active {
      transform: translateY(0);
    }

    /* Floating Rose Particles Container Overlay */
    #rose-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
      overflow: hidden;
    }

    /* Keyframe animation for rising, rotating, scaling flowers */
    .rose-particle {
      position: absolute;
      user-select: none;
      pointer-events: none;
      will-change: transform, opacity;
      animation: floatAndBloom linear forwards;
    }

    @keyframes floatAndBloom {
      0% {
        opacity: 0;
        transform: translate(0, 0) scale(0.2) rotate(0deg);
      }
      15% {
        opacity: 1;
      }
      85% {
        opacity: 0.9;
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) scale(var(--end-scale)) rotate(var(--rot));
      }
    }
  </style>
</head>
<body>

  <!-- Mail Interface -->
  <div class="mail-card">
    <div class="envelope-icon" id="envelope" onclick="openMail()">💌</div>
    <h2 class="mail-title">Special Message Delivered!</h2>
    <p class="mail-desc">Tap the mail or click below to view your message.</p>
    <button class="btn-open" onclick="openMail()">Open Mail</button>
  </div>

  <!-- Particle Layer -->
  <div id="rose-container"></div>

  <script>
    // Rose flower characters or custom PNG image transparent URLs
    const roseItems = ['🌹', '🌸', '🌺', '💮', '🌹'];

    function openMail() {
      // Trigger rose burst animation
      triggerRoseBurst();
    }

    function triggerRoseBurst() {
      const container = document.getElementById('rose-container');
      const particleCount = 70; // Total count of rising flowers

      for (let i = 0; i < particleCount; i++) {
        setTimeout(() => {
          createRoseParticle(container);
        }, i * 25); // Stagger generation for continuous bloom effect
      }
    }

    function createRoseParticle(container) {
      const particle = document.createElement('div');
      particle.className = 'rose-particle';
      
      // Select random rose/flower symbol
      particle.innerText = roseItems[Math.floor(Math.random() * roseItems.length)];

      // Random bottom/center spawn point across the screen
      const startX = Math.random() * window.innerWidth;
      const startY = window.innerHeight + 40;

      // Trajectory, rotation, scale variations
      const dx = (Math.random() - 0.5) * 500 + 'px';
      const dy = -(Math.random() * window.innerHeight * 0.95 + 200) + 'px';
      const endScale = (Math.random() * 1.8 + 0.8).toFixed(2);
      const rot = (Math.random() * 720 - 360) + 'deg';
      const duration = (Math.random() * 2.5 + 2.5) + 's';
      const fontSize = Math.floor(Math.random() * 24 + 28) + 'px';

      // Assign dynamic CSS custom variables
      particle.style.left = startX + 'px';
      particle.style.top = startY + 'px';
      particle.style.fontSize = fontSize;
      particle.style.setProperty('--dx', dx);
      particle.style.setProperty('--dy', dy);
      particle.style.setProperty('--end-scale', endScale);
      particle.style.setProperty('--rot', rot);
      particle.style.animationDuration = duration;

      container.appendChild(particle);

      // Remove element from DOM once animation ends
      setTimeout(() => {
        particle.remove();
      }, parseFloat(duration) * 1000);
    }
  </script>
</body>
</html>
