<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>It's Your Day! 💙</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #b1d4f8;
            background-image: radial-gradient(#ffffff 15%, transparent 15%);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #4a5568;
            overflow-x: hidden;
        }

        /* ---------------------------------- */
        /* CANDLE LOADING SCREEN ANIMATION    */
        /* ---------------------------------- */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: roomLightSwitch 3s infinite ease-in-out;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        /* Room darkens when the flame goes out */
        @keyframes roomLightSwitch {
            0%, 38%, 68%, 100% { background-color: #a2c9f5; }
            40%, 66% { background-color: #172a45; }
        }

        .loading-text {
            font-family: 'Fredoka', sans-serif;
            letter-spacing: 5px;
            font-size: 1.2rem;
            color: #ffffff;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .dots {
            display: inline-block;
            width: 20px;
            text-align: left;
            animation: dotAnim 1.5s infinite;
        }

        @keyframes dotAnim {
            0% { content: "."; }
            33% { content: ".."; }
            66% { content: "..."; }
        }

        /* Candles Base Frame */
        .candles-stage {
            position: relative;
            width: 220px;
            height: 100px;
            border-bottom: 4px solid #332d56;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            padding-bottom: 2px;
        }

        .candle {
            background: #ffffff;
            border: 3px solid #332d56;
            border-radius: 4px 4px 0 0;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Short Candle (Left) */
        .candle-short { 
            width: 42px; 
            height: 52px; 
        }

        /* Tall Candle (Right) */
        .candle-tall { 
            width: 32px; 
            height: 78px; 
        }

        /* Faces & Expressions */
        .face {
            position: absolute;
            top: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .eyes-normal {
            display: flex;
            gap: 8px;
        }

        .eye-dot {
            width: 3px;
            height: 3px;
            background: #332d56;
            border-radius: 50%;
        }

        /* Squinting eyes (> <) when blowing */
        .eyes-squint {
            display: none;
            font-size: 10px;
            font-weight: 900;
            color: #d9534f;
            letter-spacing: 4px;
            line-height: 1;
        }

        /* Small surprise mouth (o) on tall candle */
        .mouth-open {
            width: 5px;
            height: 6px;
            border: 2px solid #332d56;
            border-radius: 50%;
            margin-top: 2px;
            display: none;
        }

        /* Animation for Short Candle Eyes (> < vs normal) */
        .candle-short .eyes-normal {
            animation: hideNormalEyes 3s infinite;
        }
        .candle-short .eyes-squint {
            display: block;
            animation: showSquintEyes 3s infinite;
        }

        @keyframes hideNormalEyes {
            0%, 38%, 68%, 100% { opacity: 1; }
            40%, 66% { opacity: 0; }
        }

        @keyframes showSquintEyes {
            0%, 38%, 68%, 100% { opacity: 0; }
            40%, 66% { opacity: 1; }
        }

        /* Tall Candle Mouth Reacting */
        .candle-tall .mouth-open {
            display: block;
            animation: mouthReact 3s infinite;
        }

        @keyframes mouthReact {
            0%, 35%, 70%, 100% { opacity: 0; transform: scale(0.5); }
            38%, 66% { opacity: 1; transform: scale(1); }
        }

        /* Flame on Short Candle */
        .flame-container {
            position: absolute;
            top: -24px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: flameToggle 3s infinite ease-in-out;
        }

        .flame {
            width: 14px;
            height: 20px;
            background: #ffca28;
            border: 2px solid #332d56;
            border-radius: 50% 50% 35% 35%;
            animation: flameFlicker 0.4s infinite alternate;
        }

        /* Glowing Ring around flame */
        .flame-halo {
            position: absolute;
            width: 32px;
            height: 32px;
            border: 1px dashed rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
        }

        @keyframes flameFlicker {
            0% { transform: scale(1) rotate(-2deg); }
            100% { transform: scale(1.1) rotate(2deg); }
        }

        @keyframes flameToggle {
            0%, 38%, 68%, 100% { opacity: 1; transform: scale(1); }
            40%, 66% { opacity: 0; transform: scale(0.2); } /* Flame goes out */
        }

        /* ---------------------------------- */
        /* MAIN PAGE CONTENT                 */
        /* ---------------------------------- */
        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 3.2rem;
            color: #ffffff;
            text-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }

        .header p {
            font-size: 0.9rem;
            color: #ffffff;
            letter-spacing: 2px;
            font-weight: 700;
            text-transform: uppercase;
            opacity: 0.9;
        }

        /* Music Player Widget */
        .music-player {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            border-radius: 30px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            margin-bottom: 30px;
        }

        .song-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .song-title {
            font-weight: 700;
            color: #3b82f6;
            font-size: 1rem;
        }

        .song-artist {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .play-btn {
            background: #edf5ff;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3b82f6;
            font-size: 1.2rem;
            transition: background 0.2s;
        }

        .play-btn:hover {
            background: #dbeafe;
        }

        /* Action Cards Grid */
        .cards-grid {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 450px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background: #ffffff;
            flex: 1;
            min-width: 180px;
            border-radius: 24px;
            padding: 25px 15px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }

        .card-icon {
            font-size: 2.2rem;
            background: #f0f7ff;
            width: 60px;
            height: 60px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.05rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .footer-note {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #ffffff;
            letter-spacing: 2px;
            font-weight: 700;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #ffffff;
            border-radius: 28px;
            max-width: 480px;
            width: 100%;
            padding: 35px 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            position: relative;
            max-height: 80vh;
            overflow-y: auto;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .close-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.2rem;
            color: #cbd5e1;
            cursor: pointer;
        }

        .modal-header-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.2rem;
            color: #3b82f6;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-letter-text {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #475569;
            white-space: pre-line;
        }
    </style>
</head>
<body>

    <!-- Candle Loading Overlay -->
    <div id="loader">
        <div class="loading-text">
            LOADING <span id="loadingDots">...</span>
        </div>
        <div class="candles-stage">
            <!-- Short Candle (Left) -->
            <div class="candle candle-short">
                <div class="flame-container">
                    <div class="flame-halo"></div>
                    <div class="flame"></div>
                </div>
                <div class="face">
                    <div class="eyes-normal">
                        <div class="eye-dot"></div>
                        <div class="eye-dot"></div>
                    </div>
                    <div class="eyes-squint">&gt;&lt;</div>
                </div>
            </div>

            <!-- Tall Candle (Right) -->
            <div class="candle candle-tall">
                <div class="face">
                    <div class="eyes-normal">
                        <div class="eye-dot"></div>
                        <div class="eye-dot"></div>
                    </div>
                    <div class="mouth-open"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Header Section -->
    <div class="header">
        <h1>It's Your Day!</h1>
        <p>A Special Gift For Maelo 💙</p>
    </div>

    <!-- Music Player -->
    <div class="music-player">
        <div class="song-info">
            <span class="song-title">Blue</span>
            <span class="song-artist">Yung Kai</span>
        </div>
        <button class="play-btn" id="playBtn" onclick="toggleAudio()">▶</button>
    </div>

    <audio id="bgMusic" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3"></audio>

    <!-- Cards Section -->
    <div class="cards-grid">
        <div class="card" onclick="openLetter(1)">
            <div class="card-icon">📬</div>
            <div class="card-title">Birthday Letter</div>
        </div>

        <div class="card" onclick="openLetter(2)">
            <div class="card-icon">⭐</div>
            <div class="card-title">Special Wishes</div>
        </div>
    </div>

    <div class="footer-note">TAP THE CARDS TO OPEN</div>

    <!-- Modal Popup Window -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <span class="close-icon" onclick="closeLetter()">✕</span>
            <div class="modal-header-title" id="modalTitle">Title</div>
            <div class="modal-letter-text" id="modalBody">Text goes here...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        // Animate loading dots
        let dotCount = 0;
        const dotsElem = document.getElementById('loadingDots');
        setInterval(() => {
            dotCount = (dotCount + 1) % 4;
            dotsElem.innerText = '.'.repeat(dotCount);
        }, 400);

        // Hide loader after 3.2 seconds
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }, 3200);
        });

        // Letter Contents
        const letters = {
            1: {
                title: "Dear Maelo... 📬",
                text: "Happy birthday to my best friend, Maelo! 💙 I hope this new age brings you endless happiness, more success, and all the love you deserve. May your day be filled with your favorite things, lots of laughter, and maybe a little bit of chaos, the good kind, of course!\n\nYou've always been such a bright light to everyone around you, so I truly hope this year treats you extra kind and all your big dreams start to fall into place. Cheers to another year of you being awesome!\n\nOn a side note, I also wanted to say a huge thank you. Thank you for being such a genuine friend and for always being someone I can count on, no matter what."
            },
            2: {
                title: "My Wishes ✨",
                text: "Once again, Happy Birthday! My wish for you is simple: I hope you always find a reason to smile every single day.\n\nMay your heart be light, your path be clear, and your year be filled with beautiful surprises that you never saw coming.\n\nI hope you stay healthy, reach all the goals you've set, and never lose that kind heart of yours. May this chapter be the best one yet. You deserve all the stars in the sky! 💙"
            }
        };

        function openLetter(id) {
            const letter = letters[id];
            if (letter) {
                document.getElementById('modalTitle').innerText = letter.title;
                document.getElementById('modalBody').innerText = letter.text;
                document.getElementById('modalOverlay').classList.add('active');
                confetti({ particleCount: 60, spread: 60, origin: { y: 0.7 } });
            }
        }

        function closeLetter() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        // Music Toggle
        const audio = document.getElementById('bgMusic');
        const playBtn = document.getElementById('playBtn');

        function toggleAudio() {
            if (audio.paused) {
                audio.play();
                playBtn.innerText = '⏸';
            } else {
                audio.pause();
                playBtn.innerText = '▶';
            }
        }
    </script>
</body>
</html>
