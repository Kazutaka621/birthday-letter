<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Digital Letter Vault 💌</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            color: #1a2a3a;
        }

        .header h1 {
            font-family: 'Caveat', cursive;
            font-size: 3.8rem;
            line-height: 1.1;
        }

        .header p {
            font-size: 1rem;
            opacity: 0.8;
            margin-top: 5px;
        }

        /* Filter Pills */
        .filter-container {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(5px);
            border: 2px solid transparent;
            padding: 8px 20px;
            border-radius: 30px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            color: #4a5568;
            transition: all 0.2s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #ffffff;
            color: #3182ce;
            border-color: #3182ce;
            box-shadow: 0 4px 12px rgba(49, 130, 206, 0.2);
            transform: translateY(-2deg);
        }

        /* Letter Grid */
        .vault-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            max-width: 950px;
            width: 100%;
            margin-bottom: 40px;
        }

        .letter-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .letter-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.12);
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        .card-title {
            font-family: 'Caveat', cursive;
            font-size: 1.7rem;
            color: #2b6cb0;
            line-height: 1.2;
            margin-bottom: 6px;
        }

        .card-subtitle {
            font-size: 0.85rem;
            color: #718096;
        }

        .badge-lock {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #e53e3e;
            color: white;
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        /* Modal / Window */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #fffdf9;
            border-radius: 24px;
            max-width: 580px;
            width: 100%;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
            border: 2px dashed #90cdf4;
        }

        .modal-title {
            font-family: 'Caveat', cursive;
            font-size: 2.6rem;
            color: #2b6cb0;
            text-align: center;
            margin-bottom: 15px;
        }

        .modal-img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .modal-text {
            font-family: 'Caveat', cursive;
            font-size: 1.6rem;
            line-height: 1.5;
            color: #2d3748;
            white-space: pre-line;
            margin-bottom: 25px;
        }

        .close-btn {
            display: block;
            margin: 0 auto;
            background: #edf2f7;
            color: #4a5568;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Password Form Style */
        .password-box {
            text-align: center;
            padding: 20px 0;
        }

        .password-input {
            padding: 10px 15px;
            font-size: 1rem;
            border: 2px solid #cbd5e0;
            border-radius: 10px;
            margin-top: 15px;
            outline: none;
            text-align: center;
            width: 200px;
        }

        .password-btn {
            background: #3182ce;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            border-radius: 10px;
            margin-top: 10px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Letter Vault 💌</h1>
        <p>A collection of special notes, memories, and secrets.</p>
    </div>

    <!-- Category Filters -->
    <div class="filter-container">
        <button class="filter-btn active" onclick="filterCategory('all', this)">All Letters</button>
        <button class="filter-btn" onclick="filterCategory('open-when', this)">Open When...</button>
        <button class="filter-btn" onclick="filterCategory('memories', this)">Memories</button>
        <button class="filter-btn" onclick="filterCategory('secrets', this)">Secrets 🔒</button>
    </div>

    <!-- Grid of Letters -->
    <div class="vault-grid" id="vaultGrid"></div>

    <!-- Reader Modal Window -->
    <div class="modal-overlay" id="letterModal">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        /* 
           =========================================================
           EDIT & ADD YOUR LETTERS HERE IN THIS LIST!
           =========================================================
           Categories: 'open-when', 'memories', 'secrets'
        */
        const vaultData = [
            {
                id: 1,
                category: "open-when",
                icon: "🎂",
                title: "Open On Your Birthday",
                subtitle: "Start here on your special day!",
                text: "Dear [Name],\n\nHappy Birthday! I hope your day is filled with so much joy, cake, and laughter. Welcome to your personal digital letter vault!",
                image: "https://images.unsplash.com/photo-1513151233558-d860c5398176?w=500",
                password: "" // Empty means no password needed
            },
            {
                id: 2,
                category: "open-when",
                icon: "🌧️",
                title: "Open When You're Sad",
                subtitle: "A little hug in text form",
                text: "Whenever things feel tough, just remember how strong you are.\n\nYou have survived 100% of your hardest days so far. Take a breath, make a cup of warm tea, and treat yourself gently today. ❤️",
                image: "",
                password: ""
            },
            {
                id: 3,
                category: "memories",
                icon: "📸",
                title: "That One Unforgettable Day",
                subtitle: "Remember when...",
                text: "I was looking back at old photos and found this!\n\nRemember when we [insert fun story or trip here]? That will always be one of my absolute favorite memories with you.",
                image: "https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=500",
                password: ""
            },
            {
                id: 4,
                category: "secrets",
                icon: "🔒",
                title: "Top Secret Letter",
                subtitle: "Requires secret PIN to open!",
                text: "🎉 You unlocked it!\n\nThe secret code was [your birthday/year/pin]. You mean the absolute world to me, and I hope this secret note brought a smile to your face!",
                image: "",
                password: "1234" // CHANGE THIS TO YOUR SECRET PIN CODE
            }
        ];

        // Render Letters dynamically to Grid
        function renderVault(category = 'all') {
            const grid = document.getElementById('vaultGrid');
            grid.innerHTML = '';

            const filtered = category === 'all' 
                ? vaultData 
                : vaultData.filter(item => item.category === category);

            filtered.forEach(letter => {
                const card = document.createElement('div');
                card.className = 'letter-card';
                card.onclick = () => openLetter(letter.id);

                const lockBadge = letter.password ? `<span class="badge-lock">Locked 🔒</span>` : '';

                card.innerHTML = `
                    ${lockBadge}
                    <div class="card-icon">${letter.icon}</div>
                    <div class="card-title">${letter.title}</div>
                    <div class="card-subtitle">${letter.subtitle}</div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderVault(cat);
        }

        function openLetter(id) {
            const letter = vaultData.find(l => l.id === id);
            const modalContent = document.getElementById('modalContent');

            if (letter.password) {
                // Password prompt view
                modalContent.innerHTML = `
                    <div class="password-box">
                        <div class="card-icon">🔒</div>
                        <h2 class="modal-title">Locked Secret</h2>
                        <p style="color: #718096; font-size: 0.9rem;">Enter the passcode to open this letter:</p>
                        <input type="password" id="passInput" class="password-input" placeholder="Passcode">
                        <br>
                        <button class="password-btn" onclick="checkPassword(${letter.id})">Unlock</button>
                        <br><br>
                        <button class="close-btn" onclick="closeModal()">Cancel</button>
                    </div>
                `;
            } else {
                // Standard letter view
                showLetterContent(letter);
            }

            document.getElementById('letterModal').classList.add('active');
        }

        function checkPassword(id) {
            const letter = vaultData.find(l => l.id === id);
            const input = document.getElementById('passInput').value;

            if (input === letter.password) {
                confetti({ particleCount: 70, spread: 60 });
                showLetterContent(letter);
            } else {
                alert("Incorrect PIN! Try again.");
            }
        }

        function showLetterContent(letter) {
            const modalContent = document.getElementById('modalContent');
            const imgHtml = letter.image ? `<img src="${letter.image}" class="modal-img" alt="Memory">` : '';

            modalContent.innerHTML = `
                <h2 class="modal-title">${letter.title}</h2>
                ${imgHtml}
                <div class="modal-text">${letter.text}</div>
                <button class="close-btn" onclick="closeModal()">Close Note</button>
            `;
            confetti({ particleCount: 50, spread: 50, origin: { y: 0.7 } });
        }

        function closeModal() {
            document.getElementById('letterModal').classList.remove('active');
        }

        // Close on backdrop click
        document.getElementById('letterModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // Initialize vault on page load
        renderVault();
    </script>
</body>
</html>
