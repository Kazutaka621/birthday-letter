<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>It's Your Day! 💙</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #b1d4f8;
            background-image: radial-gradient(#ffffff 15%, transparent 15%);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #4a5568;
            overflow-x: hidden;
        }

        /* ---------------------------------- */
        /* CANDLE LOADING SCREEN ANIMATION    */
        /* ---------------------------------- */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #a2c9f5;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: bgFlash 2s infinite ease-in-out;
            transition: opacity 0.6s ease, visibility 0.6s;
        }

        @keyframes bgFlash {
            0%, 45%, 100% { background-color: #a2c9f5; }
            50%, 95% { background-color: #1e293b; }
        }

        .loading-text {
            font-family: 'Fredoka', sans-serif;
            letter-spacing: 4px;
            font-size: 1.2rem;
            color: #ffffff;
            margin-bottom: 30px;
        }

        /* Candles CSS */
        .candles-container {
            position: relative;
            width: 140px;
            height: 100px;
            border-bottom: 4px solid #334155;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 15px;
            padding-bottom: 2px;
        }

        .candle {
            background: #ffffff;
            border: 3px solid #334155;
            border-radius: 4px 4px 0 0;
            position: relative;
            display: flex;
            justify-content: center;
        }

        .candle-1 { width: 35px; height: 50px; }
        .candle-2 { width: 30px; height: 70px; }

        .eyes {
            position: absolute;
            top: 12px;
            display: flex;
            gap: 8px;
        }

        .eye {
            width: 4px;
            height: 4px;
            background: #334155;
            border-radius: 50%;
        }

        .flame {
            position: absolute;
            top: -18px;
            width: 12px;
            height: 18px;
            background: #fbf061;
            border: 2px solid #334155;
            border-radius: 50% 50% 35% 35%;
            animation: flicker 0.6s infinite alternate;
        }

        @keyframes flicker {
            0% { transform: scale(1) rotate(-2deg); }
            100% { transform: scale(1.1) rotate(2deg); }
        }

        /* ---------------------------------- */
        /* MAIN PAGE CONTENT                 */
        /* ---------------------------------- */
        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 3.2rem;
            color: #ffffff;
            text-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }

        .header p {
            font-size: 0.9rem;
            color: #ffffff;
            letter-spacing: 2px;
            font-weight: 700;
            text-transform: uppercase;
            opacity: 0.9;
        }

        /* Music Player Widget */
        .music-player {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            border-radius: 30px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            margin-bottom: 30px;
        }

        .song-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .song-title {
            font-weight: 700;
            color: #3b82f6;
            font-size: 1rem;
        }

        .song-artist {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .play-btn {
            background: #edf5ff;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3b82f6;
            font-size: 1.2rem;
            transition: background 0.2s;
        }

        .play-btn:hover {
            background: #dbeafe;
        }

        /* Action Cards Grid */
        .cards-grid {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 450px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background: #ffffff;
            flex: 1;
            min-width: 180px;
            border-radius: 24px;
            padding: 25px 15px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }

        .card-icon {
            font-size: 2.2rem;
            background: #f0f7ff;
            width: 60px;
            height: 60px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.05rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .footer-note {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #ffffff;
            letter-spacing: 2px;
            font-weight: 700;
        }

        /* ---------------------------------- */
        /* MODAL POPUP                       */
        /* ---------------------------------- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #ffffff;
            border-radius: 28px;
            max-width: 480px;
            width: 100%;
            padding: 35px 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            position: relative;
            max-height: 80vh;
            overflow-y: auto;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .close-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.2rem;
            color: #cbd5e1;
            cursor: pointer;
        }

        .modal-header-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.2rem;
            color: #3b82f6;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-letter-text {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #475569;
            white-space: pre-line;
        }
    </style>
</head>
<body>

    <!-- Candle Loading Overlay -->
    <div id="loader">
        <div class="loading-text">L O A D I N G . .</div>
        <div class="candles-container">
            <div class="candle candle-1">
                <div class="flame"></div>
                <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
            </div>
            <div class="candle candle-2">
                <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
            </div>
        </div>
    </div>

    <!-- Header Section -->
    <div class="header">
        <h1>It's Your Day!</h1>
        <p>A Special Gift For Maelo 💙</p>
    </div>

    <!-- Music Player -->
    <div class="music-player">
        <div class="song-info">
            <span class="song-title">Blue</span>
            <span class="song-artist">Yung Kai</span>
        </div>
        <button class="play-btn" id="playBtn" onclick="toggleAudio()">▶</button>
    </div>

    <!-- Audio Element (Add your audio link or keep YouTube background link) -->
    <audio id="bgMusic" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3"></audio>

    <!-- Cards Section -->
    <div class="cards-grid">
        <div class="card" onclick="openLetter(1)">
            <div class="card-icon">📬</div>
            <div class="card-title">Birthday Letter</div>
        </div>

        <div class="card" onclick="openLetter(2)">
            <div class="card-icon">⭐</div>
            <div class="card-title">Special Wishes</div>
        </div>
    </div>

    <div class="footer-note">TAP THE CARDS TO OPEN</div>

    <!-- Modal Popup Window -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <span class="close-icon" onclick="closeLetter()">✕</span>
            <div class="modal-header-title" id="modalTitle">Title</div>
            <div class="modal-letter-text" id="modalBody">Text goes here...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        // Hide loader screen after 3 seconds
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }, 3000);
        });

        // Letter Contents (You can edit text here!)
        const letters = {
            1: {
                title: "Dear Maelo... 📬",
                text: "Happy birthday to my best friend, Maelo! 💙 I hope this new age brings you endless happiness, more success, and all the love you deserve. May your day be filled with your favorite things, lots of laughter, and maybe a little bit of chaos, the good kind, of course!\n\nYou've always been such a bright light to everyone around you, so I truly hope this year treats you extra kind and all your big dreams start to fall into place. Cheers to another year of you being awesome!\n\nOn a side note, I also wanted to say a huge thank you. Thank you for being such a genuine friend and for always being someone I can count on, no matter what."
            },
            2: {
                title: "My Wishes ✨",
                text: "Once again, Happy Birthday! My wish for you is simple: I hope you always find a reason to smile every single day.\n\nMay your heart be light, your path be clear, and your year be filled with beautiful surprises that you never saw coming.\n\nI hope you stay healthy, reach all the goals you've set, and never lose that kind heart of yours. May this chapter be the best one yet. You deserve all the stars in the sky! 💙"
            }
        };

        function openLetter(id) {
            const letter = letters[id];
            if (letter) {
                document.getElementById('modalTitle').innerText = letter.title;
                document.getElementById('modalBody').innerText = letter.text;
                document.getElementById('modalOverlay').classList.add('active');
                confetti({ particleCount: 60, spread: 60, origin: { y: 0.7 } });
            }
        }

        function closeLetter() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        // Music Toggle
        const audio = document.getElementById('bgMusic');
        const playBtn = document.getElementById('playBtn');

        function toggleAudio() {
            if (audio.paused) {
                audio.play();
                playBtn.innerText = '⏸';
            } else {
                audio.pause();
                playBtn.innerText = '▶';
            }
        }
    </script>
</body>
</html>
